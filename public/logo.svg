<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle with Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="letterGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f0f0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGradient)"/>
  
  <!-- Letter P - Modern and Bold -->
  <path d="M 180 140 L 180 380 L 280 380 L 320 380 L 320 320 L 280 320 L 280 240 L 320 240 L 320 180 L 280 180 L 180 180 Z" fill="url(#letterGradient)"/>
  <path d="M 220 180 L 220 240 L 280 240 L 280 180 Z" fill="url(#bgGradient)"/>
  
  <!-- Accent Line -->
  <line x1="180" y1="260" x2="320" y2="260" stroke="url(#letterGradient)" stroke-width="8" stroke-linecap="round" opacity="0.3"/>
</svg>
